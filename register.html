<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeTrust Bank | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(108, 98, 142, 0.9), rgba(0,0,0,0.9));
            z-index: -1;
        }

        .register-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 380px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 1.5rem;
        }

        .form-compact .form-label {
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }

        .form-compact input {
            padding: 0.4rem 0.7rem;
            font-size: 0.85rem;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }

        .bank-logo {
            width: 50px;
            margin-bottom: 1rem;
        }

        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            opacity: 0.6;
            font-size: 0.9rem;
        }

        .btn-sm-custom {
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            border-radius: 8px;
        }

        .password-strength {
            height: 2px;
            margin-top: 0.2rem;
            transition: all 0.3s ease;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top py-2">
    <div class="container">
        <a class="navbar-brand" href="index.html">PrimeTrust Bank</a>
        <div class="d-flex gap-2">
            <a href="login.html" class="btn btn-outline-light btn-sm">Login</a>
            <a href="register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
    </div>
</nav>

<!-- Registration Form -->
<div class="register-container">
    <div class="register-card">
        <div class="text-center mb-3">
            <img src="https://img.icons8.com/color/96/000000/bank-building.png" 
                 class="bank-logo">
            <h5 class="mb-3" style="font-size: 1.1rem;">Create Account</h5>
        </div>

        <form class="form-compact" id="registrationForm">
            <div class="row g-2">
                <div class="col-12">
                    <input type="text" 
                           class="form-control form-control-sm" 
                           placeholder="First Name"
                           required>
                </div>
                <div class="col-12">
                    <input type="text" 
                           class="form-control form-control-sm mt-2" 
                           placeholder="Last Name"
                           required>
                </div>
            </div>

            <div class="mt-2">
                <input type="email" 
                       class="form-control form-control-sm" 
                       placeholder="Email Address"
                       required>
            </div>

            <div class="mt-2 position-relative">
                <input type="password" 
                       class="form-control form-control-sm" 
                       id="password" 
                       placeholder="Password"
                       required
                       minlength="8">
                <span class="password-toggle" onclick="togglePassword('password')">👁️</span>
                <div class="password-strength"></div>
            </div>

            <div class="mt-2 position-relative">
                <input type="password" 
                       class="form-control form-control-sm" 
                       id="confirmPassword" 
                       placeholder="Confirm Password"
                       required>
                <span class="password-toggle" onclick="togglePassword('confirmPassword')">👁️</span>
            </div>

            <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" id="terms">
                <label class="form-check-label" style="font-size: 0.8rem;">
                    I agree to the <a href="#" class="text-decoration-none">Terms & Conditions</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-sm-custom mt-3">
                Register Now
            </button>

            <div class="text-center mt-3" style="font-size: 0.85rem;">
                Already have an account? 
                <a href="login.html" class="text-decoration-none">Sign In</a>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<footer class="fixed-bottom bg-dark text-white py-2">
    <div class="container text-center">
        <p class="mb-0 small">&copy; 2024 PrimeTrust Bank. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script>
   
   function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        field.type = field.type === 'password' ? 'text' : 'password';
    }

    // Password strength calculation
    function calculateStrength(password) {
        let strength = 0;
        if (password.length >= 8) strength++;
        if (password.match(/[A-Z]/)) strength++;
        if (password.match(/[0-9]/)) strength++;
        if (password.match(/[^A-Za-z0-9]/)) strength++;
        return Math.min(strength, 4);
    }

    $(document).ready(function() {
        $('#password').on('input', function(e) {
            const strength = calculateStrength(e.target.value);
            const strengthBar = $('.password-strength');
            const colors = ['#dc3545', '#ffc107', '#ffc107', '#28a745'];
            const widths = ['25%', '50%', '75%', '100%'];
            strengthBar.css({
                'width': widths[strength - 1],
                'background-color': colors[strength - 1]
            });
        });

        $('#registrationForm').submit(function(e) {
            e.preventDefault();
            $('.error-message').remove();

            // Client-side validation
            const password = $('#password').val();
            const confirmPassword = $('#confirmPassword').val();
            const termsChecked = $('#terms').is(':checked');

            if (!termsChecked) {
                $('#terms').after('<div class="error-message">You must agree to the terms</div>');
                return;
            }

            if (password !== confirmPassword) {
                $('#confirmPassword').after('<div class="error-message">Passwords do not match</div>');
                return;
            }

            if (calculateStrength(password) < 3) {
                $('#password').after('<div class="error-message">Password too weak</div>');
                return;
            }

            // Prepare form data
            const formData = {
                first_name: $('input[placeholder="First Name"]').val().trim(),
                last_name: $('input[placeholder="Last Name"]').val().trim(),
                email: $('input[placeholder="Email Address"]').val().trim(),
                password: password
                
            };

            // Submit data
            $.ajax({
                url: 'register_employee.php',
                method: 'POST',
                dataType: 'json',
                data: formData,
                beforeSend: function() {
                    $('#submitBtn').prop('disabled', true).html('Registering...');
                },
                success: function(response) {
                    if (response.success) {
                        window.location.href = 'login.html';
                    } else {
                        $('#registrationForm').prepend(
                            `<div class="alert alert-danger">${response.message}</div>`
                        );
                    }
                },
                error: function(xhr) {
                    let errorMessage = 'Registration failed. Please try again.';
                    try {
                        const response = JSON.parse(xhr.responseText);
                        errorMessage = response.message || errorMessage;
                    } catch(e) {}
                    $('#registrationForm').prepend(
                        `<div class="alert alert-danger">${errorMessage}</div>`
                    );
                },
                complete: function() {
                    $('#submitBtn').prop('disabled', false).html('Register Now');
                }
            });
        });
    });

</script>

</body>
</html>
